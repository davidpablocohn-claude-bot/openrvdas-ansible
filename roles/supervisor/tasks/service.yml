---
# ── Void Linux: create config and runit service for pip-installed supervisord ─
- name: Create supervisor config and log directories (Void Linux)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/supervisor/conf.d
    - /var/log/supervisor
  when: ansible_facts['os_family'] == 'Void'
  become: true

- name: Create main supervisord.conf (Void Linux — pip install has none)
  ansible.builtin.copy:
    dest: /etc/supervisor/supervisord.conf
    mode: "0644"
    content: |
      [supervisord]
      logfile=/var/log/supervisor/supervisord.log
      pidfile=/var/run/supervisord.pid
      nodaemon=false

      [unix_http_server]
      file={{ supervisor_sock }}
      chmod=0770
      chown=nobody:{{ rvdas_group }}

      [supervisorctl]
      serverurl=unix://{{ supervisor_sock }}

      [rpcinterface:supervisor]
      supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

      [include]
      files = {{ supervisor_conf_dir }}/*.{{ supervisor_conf_suffix }}
  when: ansible_facts['os_family'] == 'Void'
  become: true

- name: Create runit service directory for supervisord (Void Linux)
  ansible.builtin.file:
    path: /etc/sv/supervisord
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == 'Void'
  become: true

- name: Create runit run script for supervisord (Void Linux)
  ansible.builtin.copy:
    dest: /etc/sv/supervisord/run
    mode: "0755"
    content: |
      #!/bin/sh
      exec supervisord -n -c /etc/supervisor/supervisord.conf 2>&1
  when: ansible_facts['os_family'] == 'Void'
  become: true

# ── Enable and start ──────────────────────────────────────────────────────────
- name: Enable and start supervisor service
  ansible.builtin.service:
    name: "{{ supervisor_service_name }}"
    enabled: "{{ openrvdas_autostart }}"
    state: started
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  register: supervisor_start_result
  failed_when: false

# Fallback for containers without systemd (e.g. Docker on RHEL/Rocky):
# the systemd service file exists but systemctl is not running.
# Start supervisord directly if the service module could not start it.
- name: Start supervisord directly if service module failed (non-systemd container)
  ansible.builtin.command: >-
    supervisord -c /etc/supervisord.conf
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  changed_when: true
  when:
    - supervisor_start_result is failed
    - ansible_facts['os_family'] != 'Darwin'
  failed_when: false
