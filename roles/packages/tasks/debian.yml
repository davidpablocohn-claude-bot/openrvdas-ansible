---
# Ubuntu / Debian package installation
# Uses apt-get directly (via ansible.builtin.command) instead of ansible.builtin.apt
# because apt_pkg is a C extension compiled only for the system Python (3.8 on
# Ubuntu 20.04), and Ansible 2.12+ requires Python 3.9+ on managed nodes — the
# two requirements are incompatible with the apt module.

- name: Remove stale deadsnakes PPA files left by previous failed runs
  ansible.builtin.shell: |
    find /etc/apt/sources.list.d/ -name '*deadsnakes*' -delete || true
    apt-get update -q 2>&1 | grep -q 'deadsnakes' && \
      add-apt-repository -y -r ppa:deadsnakes/ppa 2>/dev/null || true
  changed_when: false
  failed_when: false
  when:
    - use_deadsnakes | default(true)
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Fix broken dpkg state from previous failed runs
  ansible.builtin.shell: |
    # If dpkg has half-configured packages, configure them now.
    # Use policy-rc.d to prevent post-install scripts from trying to
    # start/restart services (which fails on some VPS/cloud hosts).
    if dpkg --audit 2>/dev/null | grep -q .; then
      echo 'exit 101' > /usr/sbin/policy-rc.d
      chmod +x /usr/sbin/policy-rc.d
      dpkg --configure -a --force-confdef 2>/dev/null || true
      rm -f /usr/sbin/policy-rc.d
    fi
  become: true
  changed_when: false
  failed_when: false

- name: Update apt cache
  ansible.builtin.command: apt-get update -q
  changed_when: false

- name: Install prerequisite packages for PPA management
  ansible.builtin.command: >-
    apt-get install -y -q
    software-properties-common apt-transport-https ca-certificates
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: false
  register: apt_prereq_result
  until: apt_prereq_result.rc == 0
  retries: 3
  delay: 15

- name: Check if deadsnakes PPA supports this Ubuntu release
  ansible.builtin.shell: |
    python3 -c "
    import urllib.request, urllib.error
    try:
        urllib.request.urlopen('https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu/dists/{{ ansible_facts["distribution_release"] }}/Release', timeout=10)
        print('200')
    except urllib.error.HTTPError as e:
        print(str(e.code))
    except Exception:
        print('error')
    "
  register: deadsnakes_http_check
  failed_when: false
  changed_when: false
  when:
    - use_deadsnakes | default(true)
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Set deadsnakes availability fact
  ansible.builtin.set_fact:
    deadsnakes_ppa_available: "{{ deadsnakes_http_check.stdout | default('404') == '200' }}"
  when:
    - use_deadsnakes | default(true)
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Add deadsnakes PPA for Python {{ python_version }}
  ansible.builtin.command: add-apt-repository -y ppa:deadsnakes/ppa
  args:
    creates: "/etc/apt/sources.list.d/deadsnakes-ubuntu-ppa-{{ ansible_facts['distribution_release'] }}.sources"
  when:
    - use_deadsnakes | default(true)
    - ansible_facts['distribution'] == 'Ubuntu'
    - deadsnakes_ppa_available | default(false)

- name: Update apt cache after adding PPA
  ansible.builtin.command: apt-get update -q
  changed_when: false
  when:
    - use_deadsnakes | default(true)
    - ansible_facts['distribution'] == 'Ubuntu'
    - deadsnakes_ppa_available | default(false)

- name: Fall back to system Python when deadsnakes does not support this Ubuntu release
  ansible.builtin.set_fact:
    python_version: "3"
    python_bin: /usr/bin/python3
    python_packages:
      - python3
      - python3-venv
      - python3-dev
  when:
    - use_deadsnakes | default(true)
    - ansible_facts['distribution'] == 'Ubuntu'
    - not (deadsnakes_ppa_available | default(false))

- name: Install system packages
  ansible.builtin.command: >-
    apt-get install -y -q {{ (system_packages + python_packages) | join(' ') }}
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: false
  register: apt_packages_result
  until: apt_packages_result.rc == 0
  retries: 3
  delay: 15

- name: Install Node.js 20 for React UI build (Debian/Ubuntu)
  when: openrvdas_web_ui == 'react'
  block:
    - name: Install curl (required for NodeSource setup)
      ansible.builtin.command: apt-get install -y curl
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: false

    - name: Register NodeSource Node.js 20 repository
      ansible.builtin.shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list
      changed_when: false

    - name: Install nodejs
      ansible.builtin.command: apt-get install -y nodejs
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: false

- name: Disable system-managed nginx (will run under supervisord)
  ansible.builtin.service:
    name: nginx
    enabled: false
    state: stopped
  failed_when: false
