---
# macOS package installation via Homebrew
# Homebrew must not run as root, so become is explicitly disabled here.

- name: Install Homebrew packages
  community.general.homebrew:
    name: "{{ homebrew_packages }}"
    state: present
    update_homebrew: true
  become: false

- name: Install Node.js for React UI build (macOS)
  community.general.homebrew:
    name: node
    state: present
  become: false
  when: openrvdas_web_ui == 'react'
