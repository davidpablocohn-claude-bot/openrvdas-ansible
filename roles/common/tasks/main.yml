---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ rvdas_hostname }}"
  when: ansible_facts['os_family'] != 'Darwin'
  failed_when: false
  tags: [common, hostname]

- name: Ensure sshd is running after hostname change
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    state: started
    enabled: true
  when: ansible_facts['os_family'] != 'Darwin'
  failed_when: false
  tags: [common, hostname]

- name: Create rvdas system user
  ansible.builtin.import_tasks: user.yml
  when: ansible_facts['os_family'] != 'Darwin'
  tags: [common, user]

- name: Detect primary group on macOS (primary group is not the username)
  ansible.builtin.command: id -gn
  register: macos_primary_group
  changed_when: false
  when: ansible_facts['os_family'] == 'Darwin'
  tags: [common, directories]

- name: Set rvdas_group to user's actual primary group on macOS
  ansible.builtin.set_fact:
    rvdas_group: "{{ macos_primary_group.stdout }}"
  when: ansible_facts['os_family'] == 'Darwin'
  tags: [common, directories]

- name: Create required directories
  ansible.builtin.import_tasks: directories.yml
  tags: [common, directories]
