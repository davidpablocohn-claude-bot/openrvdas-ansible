---
# Dispatch to the appropriate firewall backend based on OS family and flags.
# Controlled by: install_firewalld (RedHat) / install_ufw (Debian/Ubuntu)

- name: Configure firewalld (RedHat)
  ansible.builtin.include_tasks: firewalld.yml
  when: ansible_facts['os_family'] == 'RedHat' and install_firewalld
  tags: [firewall]

- name: Configure ufw (Debian/Ubuntu)
  ansible.builtin.include_tasks: ufw.yml
  when: ansible_facts['os_family'] == 'Debian' and install_ufw
  tags: [firewall]
