---
# CentOS / RHEL / Rocky only - configure firewalld and SELinux

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present
  tags: [firewall]

- name: Enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    enabled: true
    state: started
  tags: [firewall]

- name: Open server port (TCP)
  ansible.posix.firewalld:
    port: "{{ server_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  tags: [firewall]

- name: Open non-SSL port for HTTP→HTTPS redirect
  ansible.posix.firewalld:
    port: "{{ nonssl_server_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: use_ssl and nonssl_server_port | string != ssl_server_port | string
  tags: [firewall]

- name: Open supervisord web interface port
  ansible.posix.firewalld:
    port: "{{ supervisord_webinterface_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: supervisord_webinterface
  tags: [firewall]

- name: Open additional TCP ports
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ tcp_ports_to_open }}"
  tags: [firewall]

- name: Open additional UDP ports
  ansible.posix.firewalld:
    port: "{{ item }}/udp"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ udp_ports_to_open }}"
  tags: [firewall]

- name: Enable SELinux boolean httpd_can_network_connect
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  tags: [firewall]

- name: Enable SELinux boolean nis_enabled
  ansible.posix.seboolean:
    name: nis_enabled
    state: true
    persistent: true
  tags: [firewall]
