---
# FastAPI (web_backend) requires Python 3.10+. Check python_bin here, after the
# packages role has installed it, rather than in pre_tasks where it may not exist yet.
- name: Validate python_bin is 3.10+ for React mode
  ansible.builtin.command:
    cmd: >-
      {{ python_bin }} -c
      "import sys; v=sys.version_info;
      assert (v.major,v.minor)>=(3,10),
      f'python_bin {sys.executable} is {v.major}.{v.minor} — React mode requires 3.10+'"
  changed_when: false
  when: openrvdas_web_ui == 'react'

- name: Bootstrap virtual environment with latest pip, wheel, and setuptools
  ansible.builtin.pip:
    name:
      - pip
      - wheel
      - setuptools
    state: latest
    virtualenv: "{{ install_root }}/openrvdas/venv"
    virtualenv_command: "{{ python_bin }} -m venv"
  become: true
  become_user: "{{ rvdas_user }}"

- name: Install Python requirements from requirements.txt
  ansible.builtin.pip:
    requirements: "{{ install_root }}/openrvdas/utils/requirements.txt"
    virtualenv: "{{ install_root }}/openrvdas/venv"
    virtualenv_command: "{{ python_bin }} -m venv"
    extra_args: "{{ '--proxy ' + http_proxy if http_proxy else '' }}"
  become: true
  become_user: "{{ rvdas_user }}"

# Django 6.1 (released 2026-08-05) raised its minimum SQLite from 3.31 to 3.37.
# RHEL 9 and rebuilds (Rocky/Alma/CentOS Stream 9) ship SQLite 3.34.1, and
# openrvdas's utils/requirements.txt does not pin django — so a fresh install
# there picks up 6.1 and every ORM call dies with:
#   django.db.utils.NotSupportedError: SQLite 3.37 or later is required
# Detect the SQLite that Python actually links against and hold Django at the
# newest release supporting it. Done per-host rather than pinning django
# globally, so platforms with a modern SQLite stay on current Django.
- name: Detect SQLite version available to the virtual environment
  ansible.builtin.command:
    cmd: >-
      {{ install_root }}/openrvdas/venv/bin/python -c
      "import sqlite3; print(sqlite3.sqlite_version)"
  register: _venv_sqlite_version
  changed_when: false

- name: Hold Django below 6.1 where SQLite is older than 3.37
  ansible.builtin.pip:
    name: "django<6.1"
    virtualenv: "{{ install_root }}/openrvdas/venv"
    virtualenv_command: "{{ python_bin }} -m venv"
    extra_args: "{{ '--proxy ' + http_proxy if http_proxy else '' }}"
  become: true
  become_user: "{{ rvdas_user }}"
  when: _venv_sqlite_version.stdout | trim is version('3.37', '<')

# Required when openrvdas uses pyproject.toml (dev branch and beyond): registers
# the package in the venv so imports work without the sys.path hacks that were
# removed in favour of proper packaging.
- name: Check whether pyproject.toml is present
  ansible.builtin.stat:
    path: "{{ install_root }}/openrvdas/pyproject.toml"
  register: _pyproject_toml

- name: Install openrvdas package in editable mode (pyproject.toml)
  ansible.builtin.pip:
    name: "{{ install_root }}/openrvdas"
    extra_args: "-e {{ '--proxy ' + http_proxy if http_proxy else '' }}"
    virtualenv: "{{ install_root }}/openrvdas/venv"
    virtualenv_command: "{{ python_bin }} -m venv"
  become: true
  become_user: "{{ rvdas_user }}"
  when: _pyproject_toml.stat.exists
  changed_when: false

# React mode: install FastAPI bridge deps into main venv so logger_manager can
# import async_fastapi_server_api when started with --database fastapi.
- name: Install FastAPI bridge dependencies into main venv (React mode)
  ansible.builtin.pip:
    name:
      - fastapi
      - sqlalchemy
      - aiosqlite
      - greenlet
      - pydantic
      - pydantic-settings
    virtualenv: "{{ install_root }}/openrvdas/venv"
    virtualenv_command: "{{ python_bin }} -m venv"
    extra_args: "{{ '--proxy ' + http_proxy if http_proxy else '' }}"
  become: true
  become_user: "{{ rvdas_user }}"
  when: openrvdas_web_ui == 'react'

# React mode: create a separate venv for web_backend (FastAPI + uvicorn)
- name: Bootstrap web_backend virtual environment (React mode)
  ansible.builtin.pip:
    name:
      - pip
      - wheel
      - setuptools
    state: latest
    virtualenv: "{{ install_root }}/openrvdas/web_backend/.venv"
    virtualenv_command: "{{ python_bin }} -m venv"
  become: true
  become_user: "{{ rvdas_user }}"
  when: openrvdas_web_ui == 'react'

- name: Install web_backend Python requirements (React mode)
  ansible.builtin.pip:
    requirements: "{{ install_root }}/openrvdas/web_backend/requirements.txt"
    virtualenv: "{{ install_root }}/openrvdas/web_backend/.venv"
    virtualenv_command: "{{ python_bin }} -m venv"
    extra_args: "{{ '--proxy ' + http_proxy if http_proxy else '' }}"
  become: true
  become_user: "{{ rvdas_user }}"
  when: openrvdas_web_ui == 'react'
