---
# OpenRVDAS Ansible Playbook
# Replaces utils/install_openrvdas.sh
#
# Usage:
#   ansible-playbook site.yml -i inventory/hosts.ini --ask-vault-pass
#
# Run a subset with tags:
#   ansible-playbook site.yml -i inventory/hosts.ini --tags openrvdas,supervisor
#
# Override variables at runtime:
#   ansible-playbook site.yml -i inventory/hosts.ini -e "use_ssl=true openrvdas_branch=dev"

- name: Install OpenRVDAS
  hosts: all
  gather_facts: false
  become: true

  vars_files:
    - vault/secrets.yml

  pre_tasks:
    - name: Bootstrap Python on Void Linux (no Python on fresh install)
      ansible.builtin.raw: xbps-install -Syu xbps && xbps-install -Sy python3
      when: inventory_hostname in groups.get('void', [])
      changed_when: false
      tags: always

    - name: Bootstrap Python 3.9+ on Ubuntu/Debian (Ubuntu 20.04 ships Python 3.8)
      ansible.builtin.raw: |
        # If python3 minor version is already >= 9 (Ubuntu 22.04+, Debian 12, etc.), done.
        _minor=$(python3 -V 2>/dev/null | awk -F. '{print $2}')
        [ "${_minor:-0}" -ge 9 ] && exit 0
        # python3 may simply not be installed yet (minimal Debian image).
        # Install the system python3 package and re-check before trying python3.9.
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -q && apt-get install -y python3 2>/dev/null || true
        _minor=$(python3 -V 2>/dev/null | awk -F. '{print $2}')
        [ "${_minor:-0}" -ge 9 ] && exit 0
        # Ubuntu 20.04 only: system python3 is 3.8, need python3.9.
        # Fix broken sitecustomize.py from previous failed runs first.
        python3.9 -c '' 2>&1 | grep -q 'sitecustomize' && \
          rm -f /usr/lib/python3.9/sitecustomize.py /usr/local/lib/python3.9/sitecustomize.py 2>/dev/null || true
        command -v python3.9 >/dev/null 2>&1 && exit 0
        apt-get install -y python3.9 2>/dev/null || \
          (apt-get install -y software-properties-common && \
           add-apt-repository -y ppa:deadsnakes/ppa && \
           apt-get update -q && \
           apt-get install -y python3.9)
      when: >-
        inventory_hostname in groups.get('ubuntu', []) or
        inventory_hostname in groups.get('debian', [])
      changed_when: false
      tags: always

    - name: Gather facts
      ansible.builtin.setup:
      tags: always

    - name: Set derived network variables
      ansible.builtin.set_fact:
        server_port: "{{ ssl_server_port if use_ssl else nonssl_server_port }}"
        websocket_protocol: "{{ 'wss' if use_ssl else 'ws' }}"
      tags: always

    - name: Prompt to install ufw on Ubuntu/Debian
      ansible.builtin.pause:
        prompt: |

          The ufw firewall can be configured to restrict access to only the
          ports used by OpenRVDAS on {{ inventory_hostname }}.
          Install and configure ufw? [yes/no]
      register: _ufw_prompt
      when:
        - ansible_facts['os_family'] == 'Debian'
        - install_ufw is not defined
      tags: always

    - name: Set install_ufw from prompt answer
      ansible.builtin.set_fact:
        install_ufw: "{{ _ufw_prompt.user_input | lower == 'yes' }}"
      when: not (_ufw_prompt.skipped | default(true))
      tags: always

    - name: Validate SSL certificate paths when using provided certs
      ansible.builtin.assert:
        that:
          - ssl_crt_location is defined and ssl_crt_location | length > 0
          - ssl_key_location is defined and ssl_key_location | length > 0
        msg: "ssl_crt_location and ssl_key_location must be set when have_ssl_certificate is true"
      when: use_ssl and have_ssl_certificate
      tags: always

  roles:
    - role: common
      tags: [common]

    - role: packages
      tags: [packages]

    - role: openrvdas
      tags: [openrvdas]

    - role: nginx
      tags: [nginx]
      when: install_gui

    - role: uwsgi
      tags: [uwsgi]
      when: install_gui

    - role: supervisor
      tags: [supervisor]

    - role: firewall
      tags: [firewall]
      when: >-
        (ansible_facts['os_family'] == 'RedHat' and install_firewalld) or
        (ansible_facts['os_family'] == 'Debian' and (install_ufw | default(false)))