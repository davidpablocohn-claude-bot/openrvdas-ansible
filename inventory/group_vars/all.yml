---
# OpenRVDAS installation defaults (non-secret)
# Override these per-host in host_vars/ or at runtime with -e

# ── Installation paths ────────────────────────────────────────────────────────
install_root: /opt
rvdas_user: rvdas
rvdas_group: rvdas

# ── Repository ────────────────────────────────────────────────────────────────
openrvdas_repo: https://github.com/oceandatatools/openrvdas
openrvdas_branch: master

# Optional HTTP proxy (empty string = no proxy)
http_proxy: ""

# ── Web server ports ──────────────────────────────────────────────────────────
nonssl_server_port: 80
ssl_server_port: 443

# ── SSL / TLS ─────────────────────────────────────────────────────────────────
# Set use_ssl: true to enable HTTPS
use_ssl: false

# Set have_ssl_certificate: true if you are supplying your own cert/key.
# Set to false to have Ansible generate a self-signed certificate.
have_ssl_certificate: false

# Paths where the cert and key will be placed (or already exist).
ssl_crt_location: "{{ install_root }}/openrvdas/openrvdas.crt"
ssl_key_location: "{{ install_root }}/openrvdas/openrvdas.key"

# ── Feature flags ─────────────────────────────────────────────────────────────
openrvdas_autostart: true   # start OpenRVDAS services on boot
install_gui: true           # install nginx + uWSGI web interface
install_firewalld: false    # configure firewalld (CentOS/RHEL only)
# install_ufw is intentionally unset here — site.yml prompts interactively on Ubuntu/Debian.
# Set install_ufw: true/false in host_vars to skip the prompt, or pass -e install_ufw=true.
# ufw_force_reset: true skips the "preserve existing rules?" prompt (useful in CI / non-interactive runs).

# ── OpenRVDAS data ports ──────────────────────────────────────────────────────
# CachedDataServer websocket port — used in supervisor templates only.
# ufw does NOT open this port: browser access is proxied via nginx /cds-ws,
# and logger processes connect via loopback.
openrvdas_data_port: 8766
# UDP ports used for instrument data broadcast between loggers.
openrvdas_udp_ports: [6224, 6225, 6226]

# ── ufw: UDP instrument data port source restriction ─────────────────────────
# "any"       — open to all (isolated vessel LAN)
# "127.0.0.1" — localhost only (laptop / dev machine)
ufw_openrvdas_source: "any"

# ── Additional firewall ports ─────────────────────────────────────────────────
tcp_ports_to_open: []
udp_ports_to_open: []

# ── Simulator ─────────────────────────────────────────────────────────────────
install_simulate_nbp: false  # install NBP1406 test data simulator
run_simulate_nbp: false      # autostart the simulator on boot

# ── InfluxDB / Grafana / Telegraf ────────────────────────────────────────────
influxdb_version: 2             # 2 or 3; only v2 is fully implemented
influxdb_org: openrvdas
influxdb_bucket: openrvdas
influxdb_port: 8086
influxdb_url: "http://localhost:{{ influxdb_port }}"

install_grafana: true           # install Grafana alongside InfluxDB
grafana_port: 3000

install_telegraf: true          # install Telegraf alongside InfluxDB

influx_log_dir: /var/log/influx

# ── Supervisord web interface ─────────────────────────────────────────────────
supervisord_webinterface: false
supervisord_webinterface_auth: false
supervisord_webinterface_port: 9001
supervisord_webinterface_user: "{{ rvdas_user }}"
# supervisord_webinterface_pass is in vault/secrets.yml
# Bind address for the supervisord HTTP interface.
# 127.0.0.1 = local access only (default, safest).
# 0.0.0.0   = accessible from any network interface (needed for remote access).
supervisord_webinterface_bind: "127.0.0.1"
