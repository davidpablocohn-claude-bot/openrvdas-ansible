---
# Debian OS-specific settings
# (ansible_os_family == 'Debian')
# Minimum supported: Debian 11 (Bullseye)

# ── Supervisor ────────────────────────────────────────────────────────────────
supervisor_service_name: supervisor
supervisor_conf_dir: /etc/supervisor/conf.d
supervisor_conf_suffix: conf
supervisor_sock: /var/run/supervisor.sock

# ── Nginx ─────────────────────────────────────────────────────────────────────
nginx_bin: /usr/sbin/nginx
nginx_uwsgi_params_src: /etc/nginx/uwsgi_params

# ── Paths ─────────────────────────────────────────────────────────────────────
etc_home: /etc

# ── User groups ───────────────────────────────────────────────────────────────
rvdas_groups:
  - tty
  - dialout
  - sudo

# ── Python (system) ───────────────────────────────────────────────────────────
# Launchpad PPAs are Ubuntu-only and do not work on Debian.
# Debian 11 ships Python 3.9 and Debian 12 ships Python 3.11 — both sufficient.
python_version: "3"
python_bin: /usr/bin/python3
use_deadsnakes: false

system_packages:
  - git
  - nginx
  - supervisor
  - build-essential
  - libreadline-dev
  - libssl-dev
  - libsqlite3-dev
  - libcrypt-dev

python_packages:
  - "python{{ python_version }}"
  - "python{{ python_version }}-venv"
  - "python{{ python_version }}-dev"
