---
# Raspberry Pi OS (Raspbian) OS-specific settings
# (ansible_os_family == 'Debian')
# Minimum supported: Raspberry Pi OS Bookworm (based on Debian 12)
# Uses system Python 3.11 — deadsnakes PPA does not publish ARM builds.

# ── Supervisor ────────────────────────────────────────────────────────────────
supervisor_service_name: supervisor
supervisor_conf_dir: /etc/supervisor/conf.d
supervisor_conf_suffix: conf
supervisor_sock: /var/run/supervisor.sock

# ── Nginx ─────────────────────────────────────────────────────────────────────
nginx_bin: /usr/sbin/nginx
nginx_uwsgi_params_src: /etc/nginx/uwsgi_params

# ── Paths ─────────────────────────────────────────────────────────────────────
etc_home: /etc

# ── User groups ───────────────────────────────────────────────────────────────
rvdas_groups:
  - tty
  - dialout
  - sudo

# ── Python 3.11 (system, no deadsnakes) ──────────────────────────────────────
python_version: "3.11"
python_bin: /usr/bin/python3.11
use_deadsnakes: false

system_packages:
  - git
  - nginx
  - supervisor
  - build-essential
  - libreadline-dev
  - libssl-dev
  - libsqlite3-dev

python_packages:
  - "python{{ python_version }}"
  - "python{{ python_version }}-venv"
  - "python{{ python_version }}-dev"
