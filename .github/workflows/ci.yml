---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── Linux: each platform runs in a Docker container on an ubuntu-latest runner ─
  test-linux:
    name: "Linux / ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-20.04
            image: ubuntu:20.04
            group: ubuntu
            python_version: "3.9"
            python_bin: /usr/bin/python3.9
            use_deadsnakes: "false"
          - name: ubuntu-22.04
            image: ubuntu:22.04
            group: ubuntu
            python_version: "3.10"
            python_bin: /usr/bin/python3.10
            use_deadsnakes: "false"
          - name: ubuntu-24.04
            image: ubuntu:24.04
            group: ubuntu
            python_version: "3.12"
            python_bin: /usr/bin/python3.12
            use_deadsnakes: "false"
          - name: debian-12
            image: debian:12
            group: debian
            python_version: "3.11"
            python_bin: /usr/bin/python3.11
            use_deadsnakes: "false"
          - name: rocky-9
            image: rockylinux:9
            group: rocky
            python_version: "3.12"
            python_bin: /usr/bin/python3.12
            use_deadsnakes: "false"
          - name: almalinux-9
            image: almalinux:9
            group: alma
            python_version: "3.12"
            python_bin: /usr/bin/python3.12
            use_deadsnakes: "false"
          - name: void
            image: ghcr.io/void-linux/void-linux:latest-full-x86_64
            group: void
            python_version: "3"
            python_bin: /usr/bin/python3
            use_deadsnakes: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible and collections
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Start test container
        run: |
          docker run -d --name ci-container \
            --privileged \
            ${{ matrix.image }} \
            sleep infinity

      - name: Install sudo shim in container
        # Containers run as root; Ansible's default become method (sudo) fails
        # if sudo isn't installed. Create a passthrough shim so become works.
        run: |
          docker exec ci-container sh -c \
            'command -v sudo >/dev/null 2>&1 || { mkdir -p /usr/local/bin && printf "#!/bin/sh\nexec \"\$@\"\n" > /usr/local/bin/sudo && chmod 755 /usr/local/bin/sudo; }'

      - name: Write CI inventory
        # GHA expands ${{ }} before the shell runs, so matrix.group is
        # interpolated even though the heredoc delimiter is quoted.
        run: |
          cat > /tmp/ci-hosts.ini << 'HOSTS'
          [openrvdas]
          ci-test ansible_connection=docker ansible_host=ci-container ansible_python_interpreter=/usr/bin/python3

          [${{ matrix.group }}]
          ci-test
          HOSTS

      - name: Write host_vars
        run: |
          mkdir -p inventory/host_vars
          cat > inventory/host_vars/ci-test.yml << EOF
          ---
          rvdas_hostname: rvdas-ci
          install_root: /opt
          rvdas_user: rvdas
          rvdas_group: rvdas
          openrvdas_repo: https://github.com/oceandatatools/openrvdas
          openrvdas_branch: master
          http_proxy: ""
          nonssl_server_port: 80
          ssl_server_port: 443
          use_ssl: false
          have_ssl_certificate: false
          ssl_crt_location: /opt/openrvdas/openrvdas.crt
          ssl_key_location: /opt/openrvdas/openrvdas.key
          openrvdas_autostart: false
          install_gui: true
          install_firewalld: false
          tcp_ports_to_open: []
          udp_ports_to_open: []
          install_simulate_nbp: false
          run_simulate_nbp: false
          supervisord_webinterface: false
          supervisord_webinterface_auth: false
          supervisord_webinterface_port: 9001
          supervisord_webinterface_user: rvdas
          python_version: "${{ matrix.python_version }}"
          python_bin: "${{ matrix.python_bin }}"
          use_deadsnakes: ${{ matrix.use_deadsnakes }}
          EOF

      - name: Set up vault secrets (test values)
        run: cp vault/secrets.yml.example vault/secrets.yml

      - name: Run playbook
        run: ansible-playbook site.yml -i /tmp/ci-hosts.ini

      - name: Idempotency check (second run)
        # Allow up to 1 changed task: Void Linux pip-installs supervisor with
        # changed_when: true by design (pip has no built-in changed detection).
        run: |
          out=$(ansible-playbook site.yml -i /tmp/ci-hosts.ini)
          echo "$out"
          changed=$(echo "$out" | grep -oP 'ci-test\s*:.*changed=\K\d+' || echo 0)
          echo "Changed tasks on second run: $changed"
          if [ "${changed:-0}" -gt 1 ]; then
            echo "FAIL: expected 0 or 1 changed tasks, got $changed"
            exit 1
          fi
          echo "OK: idempotent"

  # ── macOS: native runner, Ansible connecting to localhost ─────────────────────
  test-macos:
    name: "macOS / ${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon (arm64)
          - runner: macos-13   # Intel (x86_64)

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible and collections
        run: |
          pip3 install --quiet --break-system-packages ansible 2>/dev/null \
            || pip3 install --quiet ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Write CI inventory
        run: |
          cat > /tmp/ci-macos-hosts.ini << 'HOSTS'
          [openrvdas]
          ci-macos ansible_connection=local ansible_python_interpreter=auto_silent

          [macos]
          ci-macos
          HOSTS

      - name: Write host_vars
        run: |
          mkdir -p inventory/host_vars
          cat > inventory/host_vars/ci-macos.yml << 'EOF'
          ---
          rvdas_hostname: rvdas-ci
          # Use /tmp so no sudo is needed; macOS tasks never use become anyway
          install_root: /tmp/openrvdas-ci
          openrvdas_repo: https://github.com/oceandatatools/openrvdas
          openrvdas_branch: master
          http_proxy: ""
          # Unprivileged ports — port 80/443 require root on macOS
          nonssl_server_port: 8080
          ssl_server_port: 8443
          use_ssl: false
          have_ssl_certificate: false
          openrvdas_autostart: false
          install_gui: true
          install_firewalld: false
          tcp_ports_to_open: []
          udp_ports_to_open: []
          install_simulate_nbp: false
          run_simulate_nbp: false
          supervisord_webinterface: false
          supervisord_webinterface_auth: false
          supervisord_webinterface_port: 9001
          EOF

      - name: Set up vault secrets (test values)
        run: cp vault/secrets.yml.example vault/secrets.yml

      - name: Run playbook
        run: ansible-playbook site.yml -i /tmp/ci-macos-hosts.ini
